# Vite + Tailwind 4 deploy config.
# Overrides legacy Netlify UI settings from the CRA (main/old-ui) site
# that published to `build/` instead of `dist/`.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Ensure platform optional native deps (Tailwind oxide) are installed
  NPM_CONFIG_OPTIONAL = "true"

# React Router SPA — all paths serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache hashed Vite assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
